<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SYSTEM 84 — Acervo em transmissão</title>
<style>
  @page { size: 1440px 900px; margin: 0; }
  :root {
    --acid: #A8FF60;
    --paper: #EBEDDF;
    --muted: #9CAA9D;
    --void: #090D0B;
    --panel: #101813;
    --line: #344638;
    --ember: #FF6332;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2a2f2b; }
  body { font-family: "IBM Plex Mono", "Courier New", monospace; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page {
    position: relative;
    width: 1440px; height: 900px;
    background: var(--void);
    color: var(--paper);
    overflow: hidden;
    display: flex; flex-direction: column;
    page-break-after: always;
    break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .pad { padding: 56px 64px; }
  .label { font-size: 12px; line-height: 16.8px; letter-spacing: .08em; text-transform: uppercase; color: var(--acid); }
  .label-ember { color: var(--ember); }
  .rule { height: 1px; background: var(--line); }
  .mono { font-family: "IBM Plex Mono", "Courier New", monospace; letter-spacing: .08em; text-transform: uppercase; }

  /* ── capa ── */
  .cover { justify-content: space-between; }
  .cover-top { display: flex; justify-content: space-between; align-items: center; }
  .cover-main { display: flex; align-items: center; gap: 32px; flex: 1; }
  .cover h1 {
    font-family: "Syncopate", "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 104px; line-height: 1.02; letter-spacing: .01em; text-transform: uppercase;
  }
  .cover p { margin-top: 28px; font-family: "Space Grotesk", sans-serif; font-size: 22px; line-height: 1.45; color: var(--muted); max-width: 640px; }
  .optical { position: relative; width: 460px; height: 460px; flex: 0 0 460px; }
  .optical .rings { position: absolute; inset: 0; border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%, transparent 0 15px, rgba(168,255,96,.45) 15px 16px); }
  .optical .arc { position: absolute; inset: 10% 0 22%; border-top: 9px solid var(--ember); border-radius: 50% 50% 0 0 / 70% 70% 0 0; }
  .optical .node { position: absolute; top: 22%; right: 8%; width: 19px; height: 19px; background: var(--ember); }
  .optical .ring2 { position: absolute; inset: 5%; border: 2px solid var(--acid); border-radius: 50%; }
  .cover figcaption { font-size: 12px; letter-spacing: .08em; color: var(--ember); text-transform: uppercase; }
  .cover-foot { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ── índice ── */
  h2.section { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 52px; line-height: 1.06; letter-spacing: -.01em; }
  .toc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 32px; margin-top: 24px; display-scheme: normal; }
  .toc-grid > div { min-width: 0; }
  .toc-row { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .toc-row .n { color: var(--acid); font-size: 11px; width: 40px; flex: 0 0 40px; }
  .toc-row .y { line-height: 1.2; }
  .toc-row .t { font-family: "Space Grotesk", sans-serif; font-size: 13px; line-height: 1.2; flex: 1 1 0; min-width: 0; overflow-wrap: break-word; padding-right: 12px; }
  .toc-row .y { color: var(--muted); font-size: 10px; line-height: 1.25; text-align: right; flex: 0 0 58px; white-space: nowrap; }

  /* ── faixa de tipos ── */
  .strip { background: var(--acid); color: var(--void); display: flex; justify-content: space-between; align-items: center; padding: 24px; }

  /* ── fichas ── */
  .sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .card-cover { position: relative; height: 178px; border-bottom: 1px solid var(--line); overflow: hidden; }
  .card-cover .rings { position: absolute; inset: 18px; border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%, transparent 0 13px, rgba(168,255,96,.30) 13px 14px); }
  .card-cover .arc { position: absolute; inset: 22px 30px 40px; border-top: 4px solid var(--ember); border-radius: 50% 50% 0 0 / 60% 60% 0 0; }
  .card-cover .ring2 { position: absolute; inset: 30px; border: 1px solid var(--acid); border-radius: 50%; }
  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }
  .card-meta { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--acid); }
  .card h3 { font-family: "Syncopate", sans-serif; font-weight: 700; font-size: 17px; line-height: 1.16; letter-spacing: .02em; text-transform: uppercase; min-height: 60px; }
  .card .desc { font-family: "Space Grotesk", sans-serif; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .card .tags { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--acid); }
  .card .src { margin-top: auto; font-size: 9.5px; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── páginas de lista ── */
  .list-row { display: flex; gap: 18px; align-items: baseline; padding: 11px 0; padding-right: 120px; border-bottom: 1px solid var(--line); }
  .list-row .n { color: var(--acid); font-size: 11px; width: 46px; flex: 0 0 46px; }
  .list-row .t { font-family: "Space Grotesk", sans-serif; font-size: 17px; flex: 1; }
  .list-row .y { color: var(--muted); font-size: 11px; width: 60px; text-align: right; }
  .list-row .c { color: var(--muted); font-size: 10px; width: 150px; text-align: right; }

  /* ── ficha técnica final ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .stat { border: 1px solid var(--line); padding: 20px; }
  .stat b { display: block; font-family: "Syncopate", sans-serif; font-size: 40px; color: var(--acid); }
  .stat span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .page-num { position: absolute; right: 64px; bottom: 20px; font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; }
  .wrap { flex: 1; display: flex; flex-direction: column; }
</style>
</head>
<body>
__PAGES__
</body>
</html>

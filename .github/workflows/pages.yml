name: Publicar SYSTEM 84
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:access
      - uses: actions/cache@v4
        with:
          path: public/media
          key: media-v1-${{ runner.os }}-${{ hashFiles('src/data/catalog.json', 'scripts/download-media.mjs') }}
          restore-keys: media-v1-${{ runner.os }}-
      - name: Preparar cópias para o leitor e player internos
        run: npm run media:download
      - run: npm run check:media
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
